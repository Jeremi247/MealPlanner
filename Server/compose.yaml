# Caddy serving the LAN copy of the site. Lives in ~/mealplanner on onee-chan, beside site/ and the Caddyfile.
# Deploy.bat ships this file; Server/install.sh starts it. See docs/deploy.md.
name: mealplanner

services:
  caddy:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    command: caddy run --config /srv/Caddyfile --adapter caddyfile
    ports:
      # IPv4 only: over IPv6 Docker hands Caddy each client as a private address, past the Caddyfile's rule.
      - "0.0.0.0:443:443/tcp"
      - "0.0.0.0:443:443/udp"
    volumes:
      # The whole folder, not site/ alone: a deploy swaps site/ for a new directory.
      - .:/srv:ro
      # Holds the CA; losing it means every device trusts a new root.
      - caddy_data:/data
      - caddy_config:/config

  # The shelf of premade meals: Server/shelf.py, reached only through Caddy at /api/. No port is published.
  shelf:
    image: python:3.12.15-alpine
    restart: unless-stopped
    command: python /srv/shelf.py --data /data/shelf.json --bind 0.0.0.0 --port 8738
    volumes:
      - .:/srv:ro
      # Holds the shelf; losing it loses every premade meal.
      - shelf_data:/data

volumes:
  caddy_data:
  caddy_config:
  shelf_data:
